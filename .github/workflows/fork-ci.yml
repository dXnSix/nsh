name: Fork CI

# Every pull request of the fork is checked on every platform, whatever it
# changes. Upstream's workflows run only when a pull request touches what
# they build, and none of them runs on macOS, iOS, Android or the web, whose
# changes upstream checks by hand. This adds both:
#
# - `upstream`: starts, on the pull request's branch, each upstream workflow
#   its own `pull_request` event did not run (`.github/fork/dispatch.py`):
#   Core, Linux, Windows, GPUI, Examples and Rust application, as they are
#   defined upstream. Their checks show on the pull request with the others.
#   Upstream's Compat is disabled in the fork: it reads longbridge's
#   nsh-compat, which fails the fork's own cases. `fork-compat.yml` is the
#   fork's compat check.
# - `macos`, `ios`, `android`, `web`: clippy, tests, and the examples' tests on
#   the platform (`nsh test --target <platform>`, `.github/fork/examples.sh`):
#   macOS windows, an iOS simulator, an Android emulator, headless Chrome.
#   `web` runs the examples' tests only: clippy for the web crate is
#   upstream's to add, as no upstream workflow runs it.
# - `windows-arm64`: upstream's Windows checks (`windows.yml`), on Windows on
#   Arm (`windows-11-arm`), which no upstream workflow runs on.
#
# A fork-only file (branch kind `fork/*`): it never goes upstream, and adds
# files of its own (`.github/fork/`) rather than editing upstream's, so an
# upstream sync never conflicts with it. Pushes to `main` run the platform
# jobs too, which keeps their dependency caches for the pull requests.

on:
  push:
    branches: [main]
  pull_request:
    # As upstream's workflows (its AGENTS.md "CI", `.github/ci/paths.py`):
    # `closed` runs nothing, but it takes the pull request's concurrency group
    # and so cancels its runs still queued or running once it merges or closes.
    types: [opened, synchronize, reopened, ready_for_review, closed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's runs are grouped by its number, not by `github.ref`: a
# `closed` event of a merged pull request runs with the base branch's ref
# (`refs/heads/main`), so in a group by ref it would cancel the push run the
# merge started on `main`.
concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  upstream:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The dispatcher comes from the pull request's merge with its base, as
      # this file does: a `pr/*` branch, cut from upstream, has no
      # `.github/fork/`, and a fork change to the dispatcher runs its own.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .fork
          sparse-checkout: .github/fork
      - name: Start the upstream workflows this pull request did not run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install pyyaml
          python3 .fork/.github/fork/dispatch.py "${{ github.event.pull_request.base.sha }}" "${{ github.head_ref }}"

  macos:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p nsh-platform-macos -p nsh-macos-host -p nsh-macos-app
          --features nsh-platform-macos/dev
          -- -D warnings
      - name: Test
        run: cargo test -p nsh-platform-macos -p nsh-macos-host -p nsh-macos-app
      - name: Run the examples' tests in macOS windows
        run: |
          cargo build -p nsh-cli
          bash .github/fork/examples.sh macos

  ios:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-ios-macabi
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `nsh-platform-ios` is empty off iOS: Catalyst checks it on the Mac.
      - name: Clippy (Mac Catalyst)
        run: >
          cargo clippy
          -p nsh-platform-ios -p nsh-ios-host -p nsh-ios-app
          --target aarch64-apple-ios-macabi
          --features nsh-platform-ios/embed,nsh-platform-ios/dev
          -- -D warnings
      - name: Build the simulator's development host
        run: cargo build -p nsh-ios-host --target aarch64-apple-ios-sim
      # `nsh test --target ios` boots the newest iPhone simulator.
      - name: Run the examples' tests in an iOS simulator
        run: |
          cargo build -p nsh-cli
          bash .github/fork/examples.sh ios

  android:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The emulator runs with hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # GTK 4 and GStreamer: the examples' crates (`gallery-rs`, `rust-exports`) are built
      # for this machine too (GTK's Linux platform plays sounds and videos with GStreamer).
      - name: Install clang, GTK 4 and GStreamer
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      # The Android runtime: `javac` + `d8` (Java 17), the SDK's
      # `platforms;android-35` and an NDK: the image's default
      # (`ANDROID_NDK_HOME`, 27). QuickJS's bindings, generated with the
      # image's clang, do not build against the headers of its newest (30:
      # "Unversioned target triples are not supported").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android platform
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_NDK_HOME"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo xtask clippy-android
      # The emulator's ABI only, stripped: the development runtime of all
      # three ABIs at debug is larger than an emulator's storage.
      - name: Build the development runtime for the emulator
        run: |
          cargo xtask android --dev --abi x86_64
          runtime="$RUNNER_TEMP/nsh-runtime/android/dev"
          mkdir -p "$runtime"
          cp -R target/android/debug-dev/. "$runtime/"
          strip=$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-strip | head -1)
          "$strip" --strip-debug "$runtime/lib/x86_64/libnsh.so"
          echo "NSH_RUNTIME=$RUNNER_TEMP/nsh-runtime" >> "$GITHUB_ENV"
          cargo build -p nsh-cli
      - name: Run the examples' tests in an Android emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The default screen (320 × 640 at 160 dpi): a phone's (pixel_6,
          # 1080 × 2400) is seven times the pixels for the software renderer,
          # and the tests ran out of time.
          disk-size: 6G
          # No guest Vulkan: wgpu would pick it, and the emulator's
          # SwiftShader Vulkan stalled on the shader tests and took the
          # emulator down; GLES is what an emulator on a Mac gives wgpu.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash .github/fork/emulator-logs.sh start "$RUNNER_TEMP/emulator-logs"
            bash .github/fork/examples.sh android
      # An emulator that goes away during a test (as it did on the gallery's
      # Styles page, `examples.sh`) leaves no line in this log: the device's
      # log, the runner's memory and kernel log and the emulator's crash
      # reports say what ended it (`.github/fork/emulator-logs.sh`).
      - name: Collect the emulator's logs
        if: failure() && steps.emulator.conclusion == 'failure'
        run: bash .github/fork/emulator-logs.sh collect "$RUNNER_TEMP/emulator-logs"
      - name: Upload the emulator's logs
        if: failure() && steps.emulator.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-logs
          retention-days: 7

  web:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # QuickJS's WebAssembly build needs LLVM (clang, llvm-ar); GTK 4 and
      # GStreamer: the examples' crates (`gallery-rs`, `rust-exports`) are built for
      # this machine too (GTK's Linux platform plays sounds and videos with GStreamer).
      - name: Install clang, LLVM, GTK 4 and GStreamer
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `nsh test --target web` opens the apps in the image's Chrome.
      - name: Run the examples' tests in headless Chrome
        run: |
          cargo build -p nsh-cli
          bash .github/fork/examples.sh web

  windows-arm64:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    # The checks of upstream's `windows.yml`, on an Arm64 Windows 11 runner
    # (the `aarch64-pc-windows-msvc` host toolchain, LLVM 20 and Visual
    # Studio 2022 with the Arm64 tools on its image).
    runs-on: windows-11-arm
    env:
      # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # rustc can overflow its default stack on the `windows` crate's
      # bindings (STATUS_STACK_BUFFER_OVERRUN).
      RUST_MIN_STACK: "268435456"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check the host and libclang
        run: |
          rustc -vV | grep '^host: aarch64-pc-windows-msvc$'
          test -f "$(cygpath -u "$LIBCLANG_PATH")/libclang.dll"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p nsh-platform-windows -p nsh-windows-host -p nsh-windows-app
          -p nsh-cli -p nsh-dev -p xtask
          -- -D warnings
      # Without the optional features, as upstream checks it.
      - name: Check without optional features
        run: cargo clippy -p nsh-windows-app --no-default-features --features js -- -D warnings
      # Tests need no display: they open no window.
      - name: Test
        run: cargo test -p nsh-platform-windows -p nsh-windows-host -p nsh-windows-app -p nsh-cli -p nsh-dev -p xtask
      - name: Run the examples' tests in Win32 windows
        run: |
          cargo build -p nsh-cli
          bash .github/fork/examples.sh windows
