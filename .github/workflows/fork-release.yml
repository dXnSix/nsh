name: Fork release

# Builds NSH's distribution (`cargo xtask dist`: the CLI with its prebuilt
# hosts and runtimes) for every platform the fork serves and publishes it as
# the GitHub release of an `nshx-*` tag, so tools that pin a fork tag (rayx)
# download it instead of compiling NSH.
#
# - Pushing a tag `nshx-<workspace version>-<n>` (`scripts/sync-main.sh tag`
#   on the fork's `private/fork-docs` branch pushes it) builds and releases it.
# - Running it by hand builds and releases an existing tag, such as one made
#   before this workflow existed.
#
# A fork-only file (branch kind `fork/*`): it never goes upstream. Its build
# steps are upstream's `dist` job in `release.yml`, which keeps running on
# `v*` tags only, and the fork creates none. When an upstream sync changes
# `release.yml`, copy the change here (`sync-main.sh upstream` warns).
#
# Assets: `nsh-<platform>.tar.gz` (`.zip` on Windows), each holding one
# `nsh/` directory laid out as `dist/nsh`, with a `.sha256` beside it, and a
# build provenance attestation for each. The release is published at once,
# never kept back for review: a download must not need a signed-in user. It
# is made once the four required platforms built; Windows ARM64 is attached
# when it built and never holds the release back.
#
# The Android and web runtimes are the same on every machine. As in
# upstream's `release.yml`, the x86_64 Linux leg (`shared`) alone builds
# them; every other leg sets `NSH_DIST_NO_ANDROID` and `NSH_DIST_NO_WEB` and
# skips Java, the Android platform and the wasm32 C tools. Upstream ships
# them as components of their own (`nsh component pack`), which an installed
# nsh downloads from longbridge/nsh's release; the fork's archives keep the
# whole distribution instead, so the Release job copies them from the x86_64
# Linux archive into the others before it attests them. The macOS and x86_64
# Windows archives get the Android runtime, its embedding SDK
# (`embed/android`) and the web runtime; the arm64 Linux and Windows archives
# get the web runtime only, as before: their legs never built Android (the
# NDK has no toolchain for arm64 Linux, the Windows on Arm image no SDK).

on:
  push:
    tags: ["nshx-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The fork tag to build and release (e.g. nshx-0.2.0-4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # `nshx-<workspace version>-<n>` on a commit of the fork's `main`.
      - name: Check the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ ! "$TAG" =~ ^nshx-${version//./\\.}-[0-9]+$ ]]; then
            echo "::error::tag $TAG is not nshx-$version-<n> (the workspace version is $version)"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main; then
            echo "::error::tag $TAG is not on origin/main"
            exit 1
          fi

  dist:
    name: dist (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # The components the same everywhere (Android, web) come from x86_64
        # Linux's build alone (`shared`), as in upstream's `release.yml`; the
        # Release job copies them into the other archives (see above).
        include:
          # The iOS runtimes and SDK need Xcode; the macOS runtime is built
          # for this machine (Apple silicon).
          - name: macos-arm64
            os: macos-15
          # Ubuntu 24.04 has GTK 4.14 and Pango 1.52+, what the Linux runtime
          # needs; its binaries need glibc 2.39 and GTK 4.14 or newer where
          # they run.
          - name: linux-x86_64
            os: ubuntu-24.04
            shared: true
          # The Linux guests (Lima) on Apple silicon Macs.
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-latest
          # Optional: it may fail without holding the release back.
          - name: windows-arm64
            os: windows-11-arm
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release run builds the tag, never the branch it was started on.
          ref: ${{ env.TAG }}

      # Temporary directories (tests, tools) outside the checkout.
      - name: Set up the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "ARCHIVE=nsh-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set up Windows
        if: runner.os == 'Windows'
        run: |
          # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          # rustc can overflow its default stack on the `windows` crate.
          echo "RUST_MIN_STACK=268435456" >> "$GITHUB_ENV"

      # QuickJS is C (bindgen needs libclang); the Linux runtime links GTK 4,
      # the GPUI runtime X11, Wayland, xkbcommon, fontconfig and FreeType,
      # GTK 3 and WebKitGTK 4.1 (web views) and GStreamer (videos).
      - name: Install clang, GTK 4 and GPUI's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # The Android runtime: `javac` + `d8` (Java 17), the SDK's
      # `platforms;android-35` and an NDK (the images have the SDK and NDKs).
      - uses: actions/setup-java@v4
        if: ${{ matrix.shared }}
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android platform
        if: ${{ matrix.shared }}
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager* | head -1)
            yes | "$sdkmanager" "platforms;android-35" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/ndk" || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The web runtime's C code (zstd) needs upstream LLVM: Apple's clang
      # does not target wasm32. Check the C tools before building runtimes.
      - name: Set up WebAssembly C tools
        if: ${{ matrix.shared }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list llvm > /dev/null 2>&1 || brew install llvm
            llvm_bin="$(brew --prefix llvm)/bin"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            llvm_bin="C:/Program Files/LLVM/bin"
            suffix=".exe"
          else
            llvm_bin=/usr/bin
          fi
          cc="$llvm_bin/clang$suffix"
          ar="$llvm_bin/llvm-ar$suffix"
          if [[ "$RUNNER_OS" == Windows ]]; then
            # quickjs-jit-sys canonicalizes its vendored WASI include directory
            # to a verbatim Windows path. Give clang ordinary drive paths
            # so nested includes such as bits/alltypes.h resolve correctly.
            cat > "$RUNNER_TEMP/nsh-wasm-clang.py" <<'PYTHON'
          import os
          import subprocess
          import sys

          def normalize(argument):
              for prefix in ("-isystem", "-I", "-L", ""):
                  marker = prefix + "\\\\?\\"
                  if argument.startswith(marker):
                      path = argument[len(marker):]
                      if len(path) > 2 and path[1:3] == ":\\":
                          return prefix + path.replace("\\", "/")
              return argument

          if __name__ == "__main__":
              sys.exit(subprocess.call([os.environ["NSH_WASM_CLANG"], *map(normalize, sys.argv[1:])]))
          PYTHON
            printf '@echo off\r\npython "%%~dp0nsh-wasm-clang.py" %%*\r\n' > "$RUNNER_TEMP/nsh-wasm-clang.cmd"
            export NSH_WASM_CLANG="$cc"
            echo "NSH_WASM_CLANG=$cc" >> "$GITHUB_ENV"
            cc="$(cygpath -m "$RUNNER_TEMP")/nsh-wasm-clang.cmd"
          fi
          printf 'int nsh_wasm_probe(void) { return 0; }\n' | \
            "$cc" --target=wasm32-unknown-unknown -x c -c - -o "$RUNNER_TEMP/wasm-probe.o"
          "$ar" rcs "$RUNNER_TEMP/wasm-probe.a" "$RUNNER_TEMP/wasm-probe.o"
          echo "CC_wasm32_unknown_unknown=$cc" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$ar" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-fork-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fork-release-cargo-

      # The release profile's fat LTO over one codegen unit links each of
      # the distribution's ~15 executables single-threaded, 5 to 25 minutes
      # apiece: thin LTO over 16 units takes a fraction of that for little
      # run-time cost. The web profile, which inherits release, keeps fat
      # LTO: what pages download is built for size (docs/dev/web.md).
      - name: Build the distribution
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_WEB_LTO: fat
          CARGO_PROFILE_WEB_CODEGEN_UNITS: "1"
          NSH_DIST_NO_ANDROID: ${{ !matrix.shared && '1' || '' }}
          NSH_DIST_NO_WEB: ${{ !matrix.shared && '1' || '' }}
        run: cargo xtask dist -v

      # The packaged CLI makes and bundles a new app.
      - name: Smoke test
        run: |
          nsh=dist/nsh/bin/nsh
          [[ "$RUNNER_OS" != Windows ]] || nsh=dist/nsh/bin/nsh.exe
          "$nsh" --version
          app="$RUNNER_TEMP/smoke-app"
          "$nsh" init "$app"
          "$nsh" build "$app" -o "$RUNNER_TEMP/smoke-out" --release
          ls "$RUNNER_TEMP/smoke-out"
          find dist/nsh -type f | sort

      - name: Package
        run: |
          mkdir -p target/release-assets
          cd target/release-assets
          cp -R ../../dist/nsh nsh
          cp ../../README.md ../../LICENSE-APACHE nsh/
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "$ARCHIVE.zip" nsh > /dev/null
            sha256sum "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          else
            tar -czf "$ARCHIVE.tar.gz" nsh
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          rm -rf nsh
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: nsh-${{ matrix.name }}
          path: target/release-assets/*
          if-no-files-found: error

  release:
    name: Release
    needs: dist
    # After the matrix, also when the optional Windows ARM64 build failed.
    if: ${{ !cancelled() && needs.dist.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nsh-*
          path: assets
          merge-multiple: true

      # The four required platforms must have built; Windows ARM64 is
      # attached when it did.
      - name: Check the archives
        run: |
          missing=0
          for archive in nsh-macos-arm64.tar.gz nsh-linux-x86_64.tar.gz nsh-linux-arm64.tar.gz nsh-windows-x86_64.zip; do
            for file in "$archive" "$archive.sha256"; do
              if [[ ! -f "assets/$file" ]]; then
                echo "::error::$file did not build"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Check the digests
        working-directory: assets
        run: |
          for digest in *.sha256; do
            shasum -a 256 -c "$digest"
          done

      # The Android and web runtimes come from x86_64 Linux's build alone
      # (see above): each other archive gets those it held when every leg
      # built them, is packed again and gets a new digest (a `*` before the
      # name on Windows, as Git Bash's `sha256sum` writes it). Windows
      # ARM64's archive is missing when its leg failed.
      - name: Add the shared runtimes
        working-directory: assets
        run: |
          shared="$RUNNER_TEMP/shared"
          mkdir -p "$shared"
          tar -xzf nsh-linux-x86_64.tar.gz -C "$shared" \
            nsh/runtime/android nsh/runtime/web nsh/embed/android
          add() {
            local archive=$1 path="$PWD/$1" work="$RUNNER_TEMP/repack" part
            shift
            [[ -f "$archive" ]] || return 0
            rm -rf "$work"
            mkdir -p "$work"
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d "$work"
            else
              tar -xzf "$archive" -C "$work"
            fi
            for part in "$@"; do
              if [[ -e "$work/nsh/$part" ]]; then
                echo "::error::$archive already holds $part"
                return 1
              fi
              mkdir -p "$(dirname "$work/nsh/$part")"
              cp -a "$shared/nsh/$part" "$work/nsh/$part"
            done
            rm "$archive"
            if [[ "$archive" == *.zip ]]; then
              (cd "$work" && zip -qry "$path" nsh)
              sha256sum -b "$archive" > "$archive.sha256"
            else
              tar -czf "$archive" -C "$work" nsh
              sha256sum "$archive" > "$archive.sha256"
            fi
            rm -rf "$work"
            echo "$archive: added $*"
          }
          add nsh-macos-arm64.tar.gz runtime/android runtime/web embed/android
          add nsh-windows-x86_64.zip runtime/android runtime/web embed/android
          add nsh-linux-arm64.tar.gz runtime/web
          add nsh-windows-arm64.zip runtime/web
          rm -rf "$shared"
          ls -l

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            assets/nsh-*.tar.gz
            assets/nsh-*.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: assets/*
