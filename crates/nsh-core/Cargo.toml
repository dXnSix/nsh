[package]
name = "nsh-core"
description = "Platform-independent core: shadow tree, styles, layout and mount instructions."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nsh-animation.workspace = true
rustc-hash.workspace = true
slab.workspace = true
taffy.workspace = true
serde_json.workspace = true
nsh-macros.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
log.workspace = true
resvg = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }

[features]
# SVG images for the native backends (`svg`: sniffing, sizes and rasters with
# resvg). The web runtime leaves it off: the browser draws SVG itself.
svg = ["dep:resvg", "dep:flate2", "dep:roxmltree"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
