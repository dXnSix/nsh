[package]
name = "nsh-base"
description = "Behavior and infrastructure foundations of NSH apps' UI (`nsh/base`), unstyled: navigation, safe areas, dialogs, the keyboard and the status bar."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["highlight"]
# Built-in syntax highlighting of `TextView`'s code blocks (syntect).
# Native builds carry the syntaxes (two-face); WebAssembly fetches them.
highlight = ["dep:syntect", "dep:two-face"]

[dependencies]
nsh-core.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
serde.workspace = true
markdown.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
regex.workspace = true
ropey.workspace = true
unicode-segmentation.workspace = true
imara-diff.workspace = true
log.workspace = true
syntect = { workspace = true, optional = true }

# The syntaxes are in native builds, which also write the dump the web
# runtime fetches when it first highlights (`syntax_data`): they are 0.9 MB
# that compression barely shrinks, which pages without code never need.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
two-face = { workspace = true, optional = true }
syntect = { workspace = true, optional = true, features = ["dump-create"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
syntect = { workspace = true, optional = true, features = ["dump-load"] }

[dev-dependencies]
# The components' tests run them headless (`tests/base`), without QuickJS.
nsh-engine.workspace = true
nsh-testing.workspace = true
